name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen
      # The research-workspace tests read the pinned third-party skills, which are not vendored.
      - name: Install Nature Skills (hash-verified)
        run: python scripts/install-nature-skills.py
      - name: Run pytest
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and build
        working-directory: frontend
        run: |
          npm run prepare:pdf
          npm run build
